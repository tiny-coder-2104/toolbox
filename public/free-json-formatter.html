<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F172A">
<title>JSON Formatter — TinyCoder</title>
<style>
:root{--bg:#0F172A;--card-bg:#1E293B;--text:#E2E8F0;--accent:#06B6D4;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{text-align:center;padding:2rem 1rem;border-bottom:1px solid var(--border)}
header h1{font-size:2rem;color:var(--accent);margin-bottom:.5rem}
header p{color:#888;font-size:1rem}
main{max-width:820px;margin:0 auto;padding:2rem 1rem 2rem}
.tool-bar{display:flex;flex-wrap:wrap;gap:.65rem;margin-bottom:1rem}
.tool-bar button{background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.55rem 1rem;cursor:pointer;font-size:.9rem;transition:border-color .2s,background .2s}
.tool-bar button:hover{border-color:var(--accent);background:rgba(6,182,212,.1)}
textarea{width:100%;background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.75rem;font-family:'SF Mono',Consolas,monospace;font-size:.9rem;resize:vertical;line-height:1.5}
textarea:focus{outline:none;border-color:var(--accent)}
textarea[readonly]{background:rgba(30,41,59,.6)}
.output-wrap{position:relative;margin-top:1rem}
.out-box{display:block;width:100%;min-height:60px;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:.75rem;font-family:'SF Mono',Consolas,monospace;font-size:.9rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#aaa}
.err{color:#ff5252}
.copy-btn{position:absolute;top:.6rem;right:.6rem;background:var(--card-bg);color:var(--accent);border:1px solid var(--border);border-radius:6px;padding:.3rem .6rem;cursor:pointer;font-size:.75rem}
.copy-btn:hover{border-color:var(--accent)}
.sample-btn{position:absolute;top:.6rem;right:5.5rem;background:var(--card-bg);color:var(--accent);border:1px solid var(--border);border-radius:6px;padding:.3rem .6rem;cursor:pointer;font-size:.75rem}
.sample-btn:hover{border-color:var(--accent)}
footer{text-align:center;padding:2rem 1rem;border-top:1px solid var(--border);color:#555;font-size:.85rem}
footer a{color:var(--accent);text-decoration:underline}
@media(max-width:600px){.tool-bar button{padding:.4rem .7rem;font-size:.8rem}}
</style>
</head>
<body>
<header>
<h1>JSON Formatter</h1>
<p>Format, validate, and minify JSON — right in your browser</p>
</header>
<main>
<div class="tool-bar">
<button data-act="format">Format</button>
<button data-act="minify">Minify</button>
<button data-act="validate">Validate</button>
</div>
<textarea id="json-in" rows="12" placeholder='Paste JSON here, e.g. {"a":1,"b":[2,3]}'></textarea>
<div class="output-wrap">
<textarea id="json-out" rows="12" readonly placeholder="Output appears here"></textarea>
<button class="sample-btn" id="sample-btn">Sample</button>
<button class="copy-btn" id="copy-btn">Copy</button>
</div>
</main>
<footer>
<p>Free sample from <a href="https://tinycoderstudio.gumroad.com/l/gyhehh?utm_source=free_tool&utm_medium=free_html&utm_campaign=lead_gen_2026" target="_blank" rel="noopener">TinyCoder Toolbox</a> — full 5-tool PWA starter $29. <a href="/privacy.html">Privacy Policy</a>.</p>
</footer>
<script>
const SAMPLE = JSON.stringify({name:"TinyCoder",tools:["JSON","Base64","Regex","URL","UUID"],version:"1.0",features:{offline:true,pwa:true,noBackend:true}},null,2);
const inEl=document.getElementById('json-in');
const outEl=document.getElementById('json-out');
const copyBtn=document.getElementById('copy-btn');
const sampleBtn=document.getElementById('sample-btn');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function posToLineCol(str,pos){
  let line=1,col=1;
  for(let i=0;i<pos&&i<str.length;i++){
    if(str[i]==='\n'){line++;col=1} else col++;
  }
  return{line,col};
}

function formatJSON(){
  const raw=inEl.value;
  if(!raw.trim()){outEl.value='';return}
  try{
    const parsed=JSON.parse(raw);
    outEl.value=JSON.stringify(parsed,null,2);
  }catch(e){
    const m=e.message.match(/position\s+(\d+)/i);
    if(m){
      const p=parseInt(m[1]);
      const{line,col}=posToLineCol(raw,p);
      outEl.value='Invalid JSON at line '+line+', col '+col+': '+e.message;
    }else{
      outEl.value='Invalid JSON: '+e.message;
    }
    outEl.classList.add('err');
  }
}

function minifyJSON(){
  const raw=inEl.value;
  if(!raw.trim()){outEl.value='';return}
  try{
    const parsed=JSON.parse(raw);
    outEl.value=JSON.stringify(parsed);
    outEl.classList.remove('err');
  }catch(e){
    formatJSON();
  }
}

function validateJSON(){
  const raw=inEl.value;
  if(!raw.trim()){outEl.value='';return}
  try{
    JSON.parse(raw);
    outEl.value='Valid JSON ✓';
    outEl.classList.remove('err');
  }catch(e){
    const m=e.message.match(/position\s+(\d+)/i);
    if(m){
      const p=parseInt(m[1]);
      const{line,col}=posToLineCol(raw,p);
      outEl.value='Invalid JSON at line '+line+', col '+col+': '+e.message;
    }else{
      outEl.value='Invalid JSON: '+e.message;
    }
    outEl.classList.add('err');
  }
}

document.querySelectorAll('.tool-bar button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const act=btn.dataset.act;
    outEl.classList.remove('err');
    if(act==='format')formatJSON();
    else if(act==='minify')minifyJSON();
    else validateJSON();
  });
});

copyBtn.addEventListener('click',()=>{
  const text=outEl.value.trim();
  if(!text)return;
  navigator.clipboard.writeText(text).then(()=>{
    const old=copyBtn.textContent;
    copyBtn.textContent='Copied ✓';
    setTimeout(()=>{copyBtn.textContent=old},1200);
  });
});

sampleBtn.addEventListener('click',()=>{
  inEl.value=SAMPLE;
  outEl.value='';
  outEl.classList.remove('err');
});
</script>
</body>
</html>
