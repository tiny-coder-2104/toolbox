<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <clipPath id="round">
      <rect width="100" height="100" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <!-- Navy background -->
  <rect width="100" height="100" rx="18" ry="18" fill="#0F172A"/>

  <!-- Cyan border — visible on light backgrounds -->
  <rect width="100" height="100" rx="18" ry="18" fill="none" stroke="#06B6D4" stroke-width="2"/>

  <!-- &lt; bracket: left wall + top wall of a screen -->
  <!-- Forms the corner of a window; the opening on the right implies &gt; -->
  <path d="M 24 76 L 24 24 L 72 24"
        fill="none"
        stroke="#06B6D4"
        stroke-width="10"
        stroke-linecap="square"
        stroke-linejoin="miter"/>
</svg>
